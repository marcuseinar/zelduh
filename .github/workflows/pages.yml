name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/multiplayer-zelda-wasm-game-fe436k
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# Pages needs to publish, and the deploy step proves who it is with an OIDC
# token rather than a stored secret.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newer one waits rather than being dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-pages-${{ hashFiles('**/Cargo.lock') }}

      - name: Build the wasm module
        run: ./build.sh

      - name: Check what is being published
        run: |
          ls -la web
          test -f web/zelduh.wasm
          test -f web/index.html
          printf 'wasm module: %s KiB\n' "$(( $(wc -c < web/zelduh.wasm) / 1024 ))"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
