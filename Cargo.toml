[workspace]
resolver = "2"
members = [
    "crates/zelduh-core",
    "crates/zelduh-assets",
    "crates/zelduh-gen",
    "crates/zelduh-render",
    "crates/zelduh-wasm",
    "crates/zelduh-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.release.package.zelduh-wasm]
opt-level = "s"
